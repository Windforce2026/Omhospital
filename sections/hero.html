<!-- Hero Section -->
    <header id="home" class="relative pt-28 pb-16 px-4 sm:px-6 overflow-hidden">
        <div class="blob bg-brand-100 dark:bg-brand-900 w-72 h-72 sm:w-96 sm:h-96 top-10 left-0"></div>
        <div class="blob bg-accent-400/20 dark:bg-accent-500/10 w-72 h-72 sm:w-96 sm:h-96 bottom-0 right-10"></div>

        <div class="max-w-7xl mx-auto relative">
            <div class="grid lg:grid-cols-2 gap-10 lg:gap-12 items-center">
                
                <div class="space-y-6 text-center lg:text-left">
                    <span class="inline-flex items-center px-4 py-1.5 bg-brand-50 dark:bg-brand-900/40 border border-brand-100 dark:border-brand-800 text-brand-600 dark:text-brand-300 rounded-full text-xs font-bold uppercase tracking-wider">
                        <i class="fa-solid fa-shield-heart mr-2"></i>Advanced Medical Facilities
                    </span>
                    <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold leading-tight text-slate-900 dark:text-white tracking-tight">
                        OM Multi Specialty <br><span class="text-brand-600 dark:text-accent-400">Hospital & Ayush Center</span>
                    </h1>
                    <p class="text-base sm:text-lg text-slate-500 dark:text-slate-400 max-w-lg mx-auto lg:mx-0 leading-relaxed">
                        Quality Healthcare with Advanced Medical Facilities. We are committed to providing comprehensive, compassionate, and accessible care 24/7.
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start pt-2">
                        <a href="#booking" class="px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-full transition shadow-lg shadow-brand-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-calendar-check mr-2"></i> Book Appointment
                        </a>
                        <a href="#contact" class="px-8 py-3.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold rounded-full transition flex items-center justify-center">
                            <i class="fa-solid fa-phone mr-2"></i> Contact Us
                        </a>
                    </div>
                </div>
                
                <!-- Carousel -->
                <div class="carousel-container relative h-[300px] sm:h-[450px] rounded-3xl shadow-2xl w-full">
                    <div class="carousel-slide active">
                        <img src="assets/img/front.png" width="1000" height="600" alt="Hospital Room" class="w-full h-full object-cover rounded-3xl">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent rounded-3xl"></div>
                    </div>
                    <div class="carousel-slide">
                        <img src="assets/img/inner.png" width="1000" height="600" alt="Doctor" class="w-full h-full object-cover rounded-3xl">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent rounded-3xl"></div>
                    </div>
                    <div class="carousel-slide">
                        <img src="assets/img/front2.png" width="1000" height="600" alt="Medical Care" class="w-full h-full object-cover rounded-3xl">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent rounded-3xl"></div>
                    </div>

                    <button type="button" class="carousel-arrow carousel-prev" aria-label="Previous photo">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" class="carousel-arrow carousel-next" aria-label="Next photo">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2 z-20">
                        <div class="carousel-dot active" data-slide="0"></div>
                        <div class="carousel-dot" data-slide="1"></div>
                        <div class="carousel-dot" data-slide="2"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
